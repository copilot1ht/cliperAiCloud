name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing semantic version tag, for example v1.10.0-beta.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version
        shell: pwsh
        run: |
          $actual = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expected = $env:RELEASE_TAG.TrimStart("v")
          if ($actual -ne $expected) {
            throw "Tag $env:RELEASE_TAG does not match package version $actual"
          }

      - run: npm ci
      - run: python -m pip install --disable-pip-version-check pytest
      - run: npm test
      - run: npm run qa:syntax
      - name: Build installers without electron-builder publishing
        run: npm run build -- --publish never

      - name: Verify versioned release artifacts
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $required = @(
            "dist/Cliper-Studio-Plus-Portable-$version.exe",
            "dist/Cliper-Studio-Plus-Setup-$version.exe",
            "dist/Cliper-Studio-Plus-Setup-$version.exe.blockmap",
            "dist/latest.yml",
            "dist/SHA256SUMS.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing release artifact: $file" }
          }
          $checksums = Get-Content "dist/SHA256SUMS.txt" -Raw
          foreach ($file in $required[0..1]) {
            $name = [IO.Path]::GetFileName($file)
            if ($checksums -notmatch [regex]::Escape($name)) {
              throw "Checksum manifest does not include $name"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Cliper-Studio-Plus-${{ env.RELEASE_TAG }}
          path: |
            dist/Cliper-Studio-Plus-Portable-*.exe
            dist/Cliper-Studio-Plus-Setup-*.exe
            dist/Cliper-Studio-Plus-Setup-*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/Cliper-Studio-Plus-Portable-*.exe
            dist/Cliper-Studio-Plus-Setup-*.exe
            dist/Cliper-Studio-Plus-Setup-*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
