services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cliper_cloud
      POSTGRES_USER: cliper
      POSTGRES_PASSWORD: cliper
    ports:
      - "5432:5432"
    volumes:
      - cliper_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliper -d cliper_cloud"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - cliper_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cliper_postgres:
  cliper_redis:
